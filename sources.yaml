# Fuentes gratuitas. Añade o quita entradas sin tocar el código.
# type: rss (RSS/Atom, por defecto) | hn (API de Hacker News)
# weight: multiplica la puntuación de la fuente (por defecto 1)
# limit: máximo de artículos por ejecución (por defecto 20; 30 en hn)
# Comprueba de vez en cuando que cada feed sigue activo.

sources:
  # --- Inteligencia artificial ---
  - name: MIT Technology Review (AI)
    url: https://www.technologyreview.com/topic/artificial-intelligence/feed
    section: ai
    weight: 1.2
  - name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
    section: ai
  - name: Google AI Blog
    url: https://blog.google/technology/ai/rss/
    section: ai
  - name: arXiv cs.AI
    url: https://rss.arxiv.org/rss/cs.AI
    section: ai
    weight: 0.6
    limit: 15
  - name: Hacker News
    url: https://hacker-news.firebaseio.com/v0
    type: hn
    section: ai
    limit: 40

