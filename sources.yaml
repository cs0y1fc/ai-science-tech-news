# Fuentes gratuitas. Añade o quita entradas sin tocar el código.
# type: rss (RSS/Atom, por defecto) | hn (API de Hacker News)
# weight: multiplica la puntuación de la fuente (por defecto 1)
# limit: máximo de artículos por ejecución (por defecto 20; 30 en hn)
# Comprueba de vez en cuando que cada feed sigue activo.

sources:
  # --- Inteligencia artificial ---
  - name: MIT Technology Review (AI)
    url: https://www.technologyreview.com/topic/artificial-intelligence/feed
    section: ia
    weight: 1.2
  - name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
    section: ia
  - name: Google AI Blog
    url: https://blog.google/technology/ai/rss/
    section: ia
  - name: arXiv cs.AI
    url: https://rss.arxiv.org/rss/cs.AI
    section: ia
    weight: 0.6
    limit: 15
  - name: Hacker News
    url: https://hacker-news.firebaseio.com/v0
    type: hn
    section: ia
    limit: 40

  # --- Ciencia ---
  - name: Nature News
    url: https://www.nature.com/nature.rss
    section: ciencia
    weight: 1.2
  - name: ScienceDaily
    url: https://www.sciencedaily.com/rss/top/science.xml
    section: ciencia
  - name: NASA
    url: https://www.nasa.gov/feed/
    section: ciencia
  - name: Quanta Magazine
    url: https://www.quantamagazine.org/feed/
    section: ciencia
  - name: Phys.org
    url: https://phys.org/rss-feed/
    section: ciencia
    weight: 0.6

  # --- Tecnología ---
  - name: Ars Technica
    url: https://feeds.arstechnica.com/arstechnica/index
    section: tech
    weight: 1.1
  - name: The Verge
    url: https://www.theverge.com/rss/index.xml
    section: tech
  - name: TechCrunch
    url: https://techcrunch.com/feed/
    section: tech
  - name: Wired
    url: https://www.wired.com/feed/rss
    section: tech

  # --- Tutoriales de programación e IA ---
  - name: dev.to (Go)
    url: https://dev.to/feed/tag/go
    section: tutoriales
    weight: 0.8
  - name: dev.to (LLM)
    url: https://dev.to/feed/tag/llm
    section: tutoriales
    weight: 0.8
  - name: Go Blog
    url: https://go.dev/blog/feed.atom
    section: tutoriales
    weight: 1.3
  - name: freeCodeCamp
    url: https://www.freecodecamp.org/news/rss/
    section: tutoriales
  - name: Real Python
    url: https://realpython.com/atom.xml
    section: tutoriales
  - name: Simon Willison
    url: https://simonwillison.net/atom/everything/
    section: tutoriales
    weight: 1.2
