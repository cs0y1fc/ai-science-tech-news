name: Actualizar y publicar

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

# Una sola ejecución a la vez; no cancelar una a medias para no perder el commit de datos.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Tests
        run: go test ./...

      - name: Generar el sitio
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM2_API_KEY: ${{ secrets.LLM2_API_KEY }}
          LLM2_MODEL: ${{ vars.LLM2_MODEL }}
          LLM2_BASE_URL: ${{ vars.LLM2_BASE_URL }}
          LLM3_API_KEY: ${{ secrets.LLM3_API_KEY }}
          LLM3_MODEL: ${{ vars.LLM3_MODEL }}
          LLM3_BASE_URL: ${{ vars.LLM3_BASE_URL }}
        run: go run ./cmd/build

      - name: Guardar el estado (data/articles.json)
        run: |
          if [ -n "$(git status --porcelain data/articles.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/articles.json
            git commit -m "Actualizar noticias [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
