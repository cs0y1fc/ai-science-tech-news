<!doctype html>
<html lang="en">
<head>{{template "head" .}}</head>
<body>
  {{template "header" .}}

  <main class="wrap">
    <h1 class="page-title">{{.Heading}}</h1>
    {{with .Blurb}}<p class="blurb">{{.}}</p>{{end}}
    {{with .Tabs}}{{template "tabs" .}}{{end}}
    {{with .Topics}}{{template "chips" .}}{{end}}
    <div class="grid">
      {{range .Cards}}{{template "card" .}}{{end}}
    </div>
    {{template "pager" .Pager}}
  </main>

  {{template "footer" .}}
</body>
</html>
